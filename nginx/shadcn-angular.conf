# Nginx configuration for shadcn-angular.tigayon.com with Angular SSR and MCP Server
# This configuration handles:
# - Angular SSR application on port 4200
# - MCP Server with basic auth on /mcp endpoint
# - SSL/TLS encryption
# - Gzip compression
# - Proper caching headers

upstream angular_app {
    least_conn;
    server localhost:4200 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream mcp_server {
    server localhost:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name shadcn-angular.tigayon.com www.shadcn-angular.tigayon.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shadcn-angular.tigayon.com www.shadcn-angular.tigayon.com;

    # SSL Certificate Configuration (Replace with your actual certificates)
    ssl_certificate /etc/letsencrypt/live/shadcn-angular.tigayon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadcn-angular.tigayon.com/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Logging
    access_log /var/log/nginx/shadcn-angular-access.log combined;
    error_log /var/log/nginx/shadcn-angular-error.log warn;

    # Root directory
    root /var/www/shadcn-angular;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Client upload size limit
    client_max_body_size 100M;

    # Connection settings
    keepalive_timeout 65;
    keepalive_requests 100;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=5r/s;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status": "healthy"}';
        add_header Content-Type application/json;
    }

    # Static assets caching (images, fonts, etc.)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # MCP Server endpoint with Basic Authentication
    location /mcp {
        # Basic authentication (username: jamel, password: jamel)
        # Generate with: echo -n "jamel:jamel" | base64
        auth_basic "MCP Server Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Rate limiting for MCP
        limit_req zone=mcp_limit burst=20 nodelay;

        # Proxy settings
        proxy_pass http://mcp_server;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;

        # Access log for MCP
        access_log /var/log/nginx/shadcn-angular-mcp.log combined;
    }

    # API endpoints (if any)
    location /api {
        # Rate limiting for API
        limit_req zone=api_limit burst=30 nodelay;

        # Proxy to Angular SSR
        proxy_pass http://angular_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts for API calls
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Main Angular SSR application
    location / {
        try_files $uri $uri/ @app;

        # Cache control for HTML
        add_header Cache-Control "public, max-age=3600";
    }

    # Angular SSR backend
    location @app {
        # Rate limiting for app
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://angular_app;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Cache control for dynamic content
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 404 error page
    error_page 404 /404.html;

    # 500 error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
